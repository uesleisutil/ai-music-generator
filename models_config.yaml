# Default settings (BEST MODELS)
defaults:
  music: "musicgen-medium"  # Best balance quality/speed
  image: "sd-2-1"  # Stable Diffusion 2.1 - excellent quality
  
# Presets by style
presets:
  quick:
    music: "musicgen-small"
    image: "wuerstchen"
    description: "Fast and light, works on CPU"
    
  balanced:
    music: "musicgen-medium"
    image: "sd-2-1"
    description: "Balance between quality and speed"
    
  quality:
    music: "musicgen-large"
    image: "sd-xl-base"
    description: "Maximum quality, requires powerful GPU"
    
  experimental:
    music: "riffusion"
    image: "kandinsky-2-2"
    description: "Alternative models with unique styles"
