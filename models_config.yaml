# Available Models Configuration (All Free!)

music_models:
  # MusicGen Models (Meta/Facebook)
  musicgen-small:
    name: "MusicGen Small"
    model_id: "facebook/musicgen-small"
    provider: "Meta"
    size: "300MB"
    quality: "Basic"
    speed: "Fast"
    gpu_required: false
    description: "Small and fast model, works on CPU"
    
  musicgen-medium:
    name: "MusicGen Medium"
    model_id: "facebook/musicgen-medium"
    provider: "Meta"
    size: "1.5GB"
    quality: "Good"
    speed: "Medium"
    gpu_required: true
    description: "Balance between quality and speed"
    
  musicgen-large:
    name: "MusicGen Large"
    model_id: "facebook/musicgen-large"
    provider: "Meta"
    size: "3.3GB"
    quality: "Excellent"
    speed: "Slow"
    gpu_required: true
    description: "Best quality, requires powerful GPU"
    
  musicgen-melody:
    name: "MusicGen Melody"
    model_id: "facebook/musicgen-melody"
    provider: "Meta"
    size: "1.5GB"
    quality: "Good"
    speed: "Medium"
    gpu_required: true
    description: "Specialized in melodies, accepts reference audio"
    
  # Riffusion (Stable Diffusion for audio)
  riffusion:
    name: "Riffusion"
    model_id: "riffusion/riffusion-model-v1"
    provider: "Riffusion"
    size: "2GB"
    quality: "Good"
    speed: "Medium"
    gpu_required: true
    description: "Generates music using Stable Diffusion, unique style"
    
  # AudioLDM (Text-to-Audio)
  audioldm:
    name: "AudioLDM"
    model_id: "cvssp/audioldm-s-full-v2"
