    size: "1.2GB"
    quality: "Good"
    speed: "Fast"
    gpu_required: false
    description: "Text-to-audio, great for sound effects and music"
    
  audioldm-large:
    name: "AudioLDM Large"
    model_id: "cvssp/audioldm-l-full"
    provider: "CVSSP"
    size: "2.5GB"
    quality: "Excellent"
    speed: "Medium"
    gpu_required: true
    description: "Larger version of AudioLDM, better quality"

