name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-music-generator
  TERRAFORM_VERSION: 1.6.0

jobs:
  ensure-ecr:
    name: Ensure ECR Repository
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR Repository Exists
        run: |
          # Check if ECR repository exists, create if not
          if ! aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region $AWS_REGION 2>/dev/null; then
            echo "Creating ECR repository..."
            aws ecr create-repository \
              --repository-name $ECR_REPOSITORY \
              --region $AWS_REGION \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Name,Value=$ECR_REPOSITORY Key=Project,Value=ai-music-generator
            echo "✅ ECR repository created"
          else
            echo "✅ ECR repository already exists"
          fi

  terraform-plan:
    name: Terraform Plan
    needs: [ensure-ecr]
    runs-on: ubuntu-latest
    outputs:
      tfplanExitCode: ${{ steps.set-exitcode.outputs.exitcode }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        id: tf-plan
        working-directory: ./terraform
        continue-on-error: true
        run: terraform plan -detailed-exitcode -no-color -out=tfplan
      
      - name: Set Plan Exit Code
        id: set-exitcode
        working-directory: ./terraform
        run: |
          # Check if plan file exists and parse it to see if there are changes
          if [ ! -f tfplan ]; then
            echo "❌ Terraform Plan: Failed - no plan file created"
            echo "exitcode=1" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Use terraform show to check if there are changes
          terraform show -json tfplan > tfplan.json
          
          # Count resources to add/change/destroy
          RESOURCE_CHANGES=$(cat tfplan.json | jq -r '.resource_changes | length')
          
          if [ "$RESOURCE_CHANGES" -gt 0 ]; then
            echo "✅ Terraform Plan: Changes detected ($RESOURCE_CHANGES resources)"
            echo "exitcode=2" >> $GITHUB_OUTPUT
          else
            echo "✅ Terraform Plan: No changes detected"
            echo "exitcode=0" >> $GITHUB_OUTPUT
          fi

      - name: Publish Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

      - name: Create Plan Summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const output = `#### Terraform Plan 📖\`${{ steps.tf-plan.outcome }}\`
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            core.summary.addRaw(output).write();

  terraform-apply:
    name: Terraform Apply
    needs: [terraform-plan]
    runs-on: ubuntu-latest
    if: needs.terraform-plan.outputs.tfplanExitCode == '2'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Clean up orphaned resources
        continue-on-error: true
        run: |
          echo "🧹 Cleaning up orphaned resources from previous partial deployments..."
          
          # Delete Batch resources (must be done in order: job queue -> compute environment)
          if aws batch describe-job-queues --job-queues ai-music-generator-queue --region $AWS_REGION 2>/dev/null | grep -q jobQueueName; then
            echo "Disabling and deleting Batch job queue: ai-music-generator-queue"
            aws batch update-job-queue --job-queue ai-music-generator-queue --state DISABLED --region $AWS_REGION || true
            sleep 5
            aws batch delete-job-queue --job-queue ai-music-generator-queue --region $AWS_REGION || true
            
            # Wait for job queue to be fully deleted (up to 2 minutes)
            echo "Waiting for job queue to be deleted..."
            for i in {1..24}; do
              if ! aws batch describe-job-queues --job-queues ai-music-generator-queue --region $AWS_REGION 2>/dev/null | grep -q jobQueueName; then
                echo "✅ Job queue deleted"
                break
              fi
              echo "  Still deleting... ($i/24)"
              sleep 5
            done
          fi
          
          if aws batch describe-compute-environments --compute-environments ai-music-generator-gpu-spot --region $AWS_REGION 2>/dev/null | grep -q computeEnvironmentName; then
            echo "Disabling and deleting Batch compute environment: ai-music-generator-gpu-spot"
            aws batch update-compute-environment --compute-environment ai-music-generator-gpu-spot --state DISABLED --region $AWS_REGION || true
            sleep 5
            aws batch delete-compute-environment --compute-environment ai-music-generator-gpu-spot --region $AWS_REGION || true
            
            # Wait for compute environment to be fully deleted (up to 2 minutes)
            echo "Waiting for compute environment to be deleted..."
            for i in {1..24}; do
              if ! aws batch describe-compute-environments --compute-environments ai-music-generator-gpu-spot --region $AWS_REGION 2>/dev/null | grep -q computeEnvironmentName; then
                echo "✅ Compute environment deleted"
                break
              fi
              echo "  Still deleting... ($i/24)"
              sleep 5
            done
          fi
          
          # Deregister job definitions
          for revision in $(aws batch describe-job-definitions --job-definition-name ai-music-generator-job --status ACTIVE --region $AWS_REGION --query 'jobDefinitions[].revision' --output text 2>/dev/null); do
            echo "Deregistering job definition: ai-music-generator-job:$revision"
            aws batch deregister-job-definition --job-definition ai-music-generator-job:$revision --region $AWS_REGION || true
          done
          
          # Delete IAM roles if they exist (detach policies first)
          for role in ai-music-generator-batch-job-role ai-music-generator-batch-service-role ai-music-generator-ecs-instance-role; do
            if aws iam get-role --role-name $role 2>/dev/null; then
              echo "Deleting IAM role: $role"
              
              # Detach managed policies
              aws iam list-attached-role-policies --role-name $role --query 'AttachedPolicies[].PolicyArn' --output text | \
                xargs -r -n1 aws iam detach-role-policy --role-name $role --policy-arn || true
              
              # Delete inline policies
              aws iam list-role-policies --role-name $role --query 'PolicyNames[]' --output text | \
                xargs -r -n1 aws iam delete-role-policy --role-name $role --policy-name || true
              
              # Delete instance profiles if any
              aws iam list-instance-profiles-for-role --role-name $role --query 'InstanceProfiles[].InstanceProfileName' --output text | \
                xargs -r -n1 -I {} aws iam remove-role-from-instance-profile --instance-profile-name {} --role-name $role || true
              
              # Delete the role
              aws iam delete-role --role-name $role || true
            fi
          done
          
          # Delete instance profile if it exists
          if aws iam get-instance-profile --instance-profile-name ai-music-generator-ecs-instance-profile 2>/dev/null; then
            echo "Deleting instance profile: ai-music-generator-ecs-instance-profile"
            aws iam delete-instance-profile --instance-profile-name ai-music-generator-ecs-instance-profile || true
          fi
          
          # Delete CloudWatch log group if it exists
          if aws logs describe-log-groups --log-group-name-prefix /aws/batch/ai-music-generator --query 'logGroups[0]' 2>/dev/null | grep -q logGroupName; then
            echo "Deleting CloudWatch log group: /aws/batch/ai-music-generator"
            aws logs delete-log-group --log-group-name /aws/batch/ai-music-generator || true
          fi
          
          echo "✅ Cleanup complete"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get S3 Bucket Name
        id: get-bucket
        working-directory: ./terraform
        run: |
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET_NAME"

  build-and-push:
    name: Build and Push Docker Image
    needs: [terraform-plan, terraform-apply]
    runs-on: ubuntu-latest
    if: always() && (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR Repository Exists
        run: |
          # Check if ECR repository exists, create if not
          if ! aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region $AWS_REGION 2>/dev/null; then
            echo "Creating ECR repository..."
            aws ecr create-repository \
              --repository-name $ECR_REPOSITORY \
              --region $AWS_REGION \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Name,Value=$ECR_REPOSITORY Key=Project,Value=ai-music-generator
            echo "✅ ECR repository created"
          else
            echo "✅ ECR repository already exists"
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        id: account-id
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.account-id.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Batch Job Definition
        env:
          ECR_REGISTRY: ${{ steps.account-id.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "ℹ️  Skipping job definition update - Terraform manages this"
          echo "The job definition created by Terraform uses the 'latest' tag"
          echo "Docker image pushed with tags: latest and $IMAGE_TAG"

  deployment-summary:
    name: Deployment Summary
    needs: [terraform-plan, terraform-apply, build-and-push]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Get Outputs
        id: outputs
        working-directory: ./terraform
        continue-on-error: true
        run: |
          # Try to get bucket name, handle errors gracefully
          BUCKET_NAME=$(terraform output -raw s3_bucket_name 2>&1 | grep -v "Warning" | grep -v "│" | head -1 || echo "not-deployed")
          
          # Clean up any terraform formatting characters
          BUCKET_NAME=$(echo "$BUCKET_NAME" | tr -d '│' | xargs)
          
          # If empty or contains error text, set to not-deployed
          if [ -z "$BUCKET_NAME" ] || [[ "$BUCKET_NAME" == *"Error"* ]] || [[ "$BUCKET_NAME" == *"No outputs"* ]]; then
            BUCKET_NAME="not-deployed"
          fi
          
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET_NAME"

      - name: Create Deployment Summary
        uses: actions/github-script@v7
        with:
          script: |
            const terraformPlan = '${{ needs.terraform-plan.result }}';
            const terraformApply = '${{ needs.terraform-apply.result }}';
            const buildPush = '${{ needs.build-and-push.result }}';
            const bucketName = '${{ steps.outputs.outputs.bucket_name }}';
            
            const summary = `## 🚀 Deployment Summary
            
            | Job | Status |
            |-----|--------|
            | Terraform Plan | ${{ needs.terraform-plan.result }} |
            | Terraform Apply | ${{ needs.terraform-apply.result }} |
            | Build & Push Docker | ${{ needs.build-and-push.result }} |
            
            ### Details
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Actor**: @${{ github.actor }}
            - **Workflow**: ${{ github.workflow }}
            - **S3 Bucket**: \`${bucketName}\`
            
            ### Next Steps
            Submit a job to test the deployment:
            \`\`\`bash
            python aws_submit_job.py \\
              --prompt "cozy lofi coffee shop music" \\
              --duration 60 \\
              --preset balanced \\
              --output-bucket ${bucketName} \\
              --wait
            \`\`\`
            
            Or use GitHub Actions:
            - Go to **Actions** > **Test Deployment** > **Run workflow**
            `;
            
            core.summary.addRaw(summary).write();
