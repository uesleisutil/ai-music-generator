name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-music-generator
  TERRAFORM_VERSION: 1.6.0

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      tfplanExitCode: ${{ steps.tf-plan.outputs.exitcode }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        id: tf-plan
        working-directory: ./terraform
        run: |
          terraform plan -detailed-exitcode -no-color -out=tfplan || export exitcode=$?
          
          # Default to 0 if exitcode is not set
          exitcode=${exitcode:-0}
          
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          echo "Terraform Plan Exit Code: $exitcode"
          
          # Exit code 0 = no changes, 1 = error, 2 = changes detected
          if [ $exitcode -eq 1 ]; then
            echo "❌ Terraform Plan Failed!"
            exit 1
          elif [ $exitcode -eq 2 ]; then
            echo "✅ Terraform Plan: Changes detected (will apply)"
            exit 0
          else
            echo "✅ Terraform Plan: No changes detected"
            exit 0
          fi

      - name: Publish Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

      - name: Create Plan Summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const output = `#### Terraform Plan 📖\`${{ steps.tf-plan.outcome }}\`
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            core.summary.addRaw(output).write();

  terraform-apply:
    name: Terraform Apply
    needs: [terraform-plan]
    runs-on: ubuntu-latest
    if: needs.terraform-plan.outputs.tfplanExitCode == 2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get S3 Bucket Name
        id: get-bucket
        working-directory: ./terraform
        run: |
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET_NAME"

  build-and-push:
    name: Build and Push Docker Image
    needs: [terraform-plan, terraform-apply]
    runs-on: ubuntu-latest
    if: always() && (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR Repository Exists
        run: |
          # Check if ECR repository exists, create if not
          if ! aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region $AWS_REGION 2>/dev/null; then
            echo "Creating ECR repository..."
            aws ecr create-repository \
              --repository-name $ECR_REPOSITORY \
              --region $AWS_REGION \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Name,Value=$ECR_REPOSITORY Key=Project,Value=ai-music-generator
            echo "✅ ECR repository created"
          else
            echo "✅ ECR repository already exists"
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        id: account-id
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.account-id.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Batch Job Definition
        env:
          ECR_REGISTRY: ${{ steps.account-id.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "ℹ️  Skipping job definition update - Terraform manages this"
          echo "The job definition created by Terraform uses the 'latest' tag"
          echo "Docker image pushed with tags: latest and $IMAGE_TAG"

  deployment-summary:
    name: Deployment Summary
    needs: [terraform-plan, terraform-apply, build-and-push]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Get Outputs
        id: outputs
        working-directory: ./terraform
        continue-on-error: true
        run: |
          # Try to get bucket name, handle errors gracefully
          BUCKET_NAME=$(terraform output -raw s3_bucket_name 2>&1 | grep -v "Warning" | grep -v "│" | head -1 || echo "not-deployed")
          
          # Clean up any terraform formatting characters
          BUCKET_NAME=$(echo "$BUCKET_NAME" | tr -d '│' | xargs)
          
          # If empty or contains error text, set to not-deployed
          if [ -z "$BUCKET_NAME" ] || [[ "$BUCKET_NAME" == *"Error"* ]] || [[ "$BUCKET_NAME" == *"No outputs"* ]]; then
            BUCKET_NAME="not-deployed"
          fi
          
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $BUCKET_NAME"

      - name: Create Deployment Summary
        uses: actions/github-script@v7
        with:
          script: |
            const terraformPlan = '${{ needs.terraform-plan.result }}';
            const terraformApply = '${{ needs.terraform-apply.result }}';
            const buildPush = '${{ needs.build-and-push.result }}';
            const bucketName = '${{ steps.outputs.outputs.bucket_name }}';
            
            const summary = `## 🚀 Deployment Summary
            
            | Job | Status |
            |-----|--------|
            | Terraform Plan | ${{ needs.terraform-plan.result }} |
            | Terraform Apply | ${{ needs.terraform-apply.result }} |
            | Build & Push Docker | ${{ needs.build-and-push.result }} |
            
            ### Details
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Actor**: @${{ github.actor }}
            - **Workflow**: ${{ github.workflow }}
            - **S3 Bucket**: \`${bucketName}\`
            
            ### Next Steps
            Submit a job to test the deployment:
            \`\`\`bash
            python aws_submit_job.py \\
              --prompt "cozy lofi coffee shop music" \\
              --duration 60 \\
              --preset balanced \\
              --output-bucket ${bucketName} \\
              --wait
            \`\`\`
            
            Or use GitHub Actions:
            - Go to **Actions** > **Test Deployment** > **Run workflow**
            `;
            
            core.summary.addRaw(summary).write();
