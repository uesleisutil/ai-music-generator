name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  validate-python:
    name: Validate Python Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-aws.txt
          pip install flake8 pylint

      - name: Check Python syntax
        run: |
          python -m py_compile src/**/*.py
          python -m py_compile aws_*.py

      - name: Run flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 aws_*.py --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Test imports
        run: |
          python -c "import aws_batch_worker; import aws_submit_job; print('✅ AWS scripts OK')"
          python -c "import sys; sys.path.insert(0, '.'); from src.pipeline_ai import run_pipeline_ai; print('✅ Pipeline OK')"

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

  validate-docker:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile syntax
        run: |
          docker build --no-cache --target builder -f Dockerfile . || docker build --no-cache -f Dockerfile . --dry-run 2>&1 | head -20
        continue-on-error: true

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3015
        continue-on-error: true

  validate-workflows:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow files
        run: |
          for workflow in .github/workflows/*.yml; do
            echo "Checking $workflow..."
            # Basic YAML syntax check
            python -c "import yaml; yaml.safe_load(open('$workflow'))" || exit 1
          done

      - name: Check required secrets documentation
        run: |
          if grep -q "AWS_ACCESS_KEY_ID" README.md && grep -q "AWS_SECRET_ACCESS_KEY" README.md; then
            echo "✅ Required secrets documented in README"
          else
            echo "⚠️  Warning: Required secrets not documented in README"
          fi

  summary:
    name: Validation Summary
    needs: [validate-python, validate-terraform, validate-docker, validate-workflows]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Create Summary
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `## ✅ Validation Results
            
            | Check | Status |
            |-------|--------|
            | Python Code | ${{ needs.validate-python.result }} |
            | Terraform | ${{ needs.validate-terraform.result }} |
            | Dockerfile | ${{ needs.validate-docker.result }} |
            | GitHub Actions | ${{ needs.validate-workflows.result }} |
            
            ### Next Steps
            ${needs.validate-python.result === 'success' && needs.validate-terraform.result === 'success' ? '✅ All checks passed! Ready to merge.' : '⚠️  Some checks failed. Please review the logs above.'}
            `;
            
            core.summary.addRaw(summary).write();
