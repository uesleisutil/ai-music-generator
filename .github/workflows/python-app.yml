name: Python Application CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=__pycache__
        # exit-zero treats all errors as warnings
        flake8 src/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=__pycache__
    
    - name: Test project structure
      run: |
        python scripts/test_basic.py
    
    - name: Check imports
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from src.generators import generate_simple_music, generate_simple_image"
        python -c "import sys; sys.path.insert(0, '.'); from src.utils import create_video"
    
    - name: Verify CLI
      run: |
        chmod +x aimusic
        python aimusic --help

  build-docs:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify documentation
      run: |
        test -f README.md
        test -f docs/QUICKSTART.md
        test -f docs/MODELS.md
        test -f docs/SETUP.md
        echo "✅ All documentation files present"
