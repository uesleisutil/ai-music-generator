name: Test Deployment

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Music prompt'
        required: true
        default: 'cozy lofi coffee shop music'
      duration:
        description: 'Duration in seconds'
        required: true
        default: '30'
      preset:
        description: 'Quality preset'
        required: true
        default: 'balanced'
        type: choice
        options:
          - quick
          - balanced
          - quality
          - experimental
      resolution:
        description: 'Video resolution'
        required: true
        default: 'hd'
        type: choice
        options:
          - hd
          - fhd
          - 2k
          - 4k
          - youtube

env:
  AWS_REGION: us-east-1

jobs:
  submit-test-job:
    name: Submit Test Job
    runs-on: ubuntu-latest
    # Only allow repository owner and collaborators to run this workflow
    # This prevents unauthorized users from generating AWS costs
    environment: production
    
    steps:
      - name: Check if user is authorized
        run: |
          # Only repository owner and collaborators can run this workflow
          echo "Workflow triggered by: ${{ github.actor }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          
          # This step will fail if secrets are not available (non-collaborators)
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ Error: AWS credentials not available. Only repository collaborators can run this workflow."
            exit 1
          fi
          
          echo "✅ User authorized to run test deployment"
      
      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-aws.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get S3 Bucket Name
        id: get-bucket
        run: |
          # Get bucket name from Terraform output
          cd terraform
          terraform init
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "Using S3 bucket: $BUCKET_NAME"
          cd ..

      - name: Submit job to AWS Batch
        id: submit-job
        run: |
          python aws_submit_job.py \
            --prompt "${{ github.event.inputs.prompt }}" \
            --duration ${{ github.event.inputs.duration }} \
            --preset ${{ github.event.inputs.preset }} \
            --resolution ${{ github.event.inputs.resolution }} \
            --output-bucket ${{ steps.get-bucket.outputs.bucket_name }} \
            --wait > job_output.txt 2>&1 || true
            --preset ${{ github.event.inputs.preset }} \
            --output-bucket ${{ steps.get-bucket.outputs.bucket_name }} \
            --wait > job_output.txt 2>&1 || true
          
          # Extract job ID from output
          JOB_ID=$(grep -oP 'Job ID: \K[0-9_]+' job_output.txt | head -1 || echo "unknown")
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
          
          cat job_output.txt

      - name: Download results
        if: success()
        run: |
          mkdir -p test-results
          aws s3 sync s3://${{ steps.get-bucket.outputs.bucket_name }}/output/${{ steps.submit-job.outputs.job_id }}/ ./test-results/

      - name: Upload test results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.submit-job.outputs.job_id }}
          path: test-results/

      - name: Create Test Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let jobOutput = 'No output available';
            try {
              jobOutput = fs.readFileSync('job_output.txt', 'utf8');
            } catch (e) {
              jobOutput = 'Error reading job output: ' + e.message;
            }
            
            // Resolution labels
            const resolutionLabels = {
              'hd': '720p - 1280x720',
              'fhd': '1080p - 1920x1080',
              '2k': '1440p - 2560x1440',
              '4k': '2160p - 3840x2160',
              'youtube': '1080p - 1920x1080'
            };
            
            const resolution = '${{ github.event.inputs.resolution }}';
            const resolutionLabel = resolutionLabels[resolution] || resolution;
            
            const summary = `## 🧪 Test Deployment Results
            
            ### Input Parameters
            - **Prompt**: ${{ github.event.inputs.prompt }}
            - **Duration**: ${{ github.event.inputs.duration }}s
            - **Preset**: ${{ github.event.inputs.preset }}
            - **Resolution**: ${resolution.toUpperCase()} (${resolutionLabel})
            - **Job ID**: ${{ steps.submit-job.outputs.job_id }}
            - **Status**: ${{ job.status }}
            
            ### Job Output
            \`\`\`
            ${jobOutput}
            \`\`\`
            
            ### Download Results
            Results available at: \`s3://${{ steps.get-bucket.outputs.bucket_name }}/output/${{ steps.submit-job.outputs.job_id }}/\`
            
            Or download from GitHub Actions artifacts above.
            `;
            
            core.summary.addRaw(summary).write();
